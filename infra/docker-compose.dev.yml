# Local dependencies for development, on machines that have Docker.
#
# If you do not have Docker, run Postgres directly instead. See the "Running
# without Docker" section of the README: the project needs a server on 5433
# with an `amc` role and the `amc` and `amc_test` databases, and nothing more.

name: amc-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amc
      POSTGRES_PASSWORD: amc
      POSTGRES_DB: amc
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Stands in for S3 locally, so the storage adapter is exercised for real
    # rather than mocked, and the same code runs against S3 in me-central-1.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: amc
      MINIO_ROOT_PASSWORD: amc-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
