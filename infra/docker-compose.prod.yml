# The whole system on one instance, as ADR-0005 describes.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
#
# Postgres, Redis-free (the queue is a table, ADR-0006), the API, the worker,
# and Caddy in front holding the only ports open to the world.

name: amc

x-server: &server
  build:
    context: ..
    target: server
  restart: unless-stopped
  # These names are the ones the code actually reads. Four of the names that
  # were here before — S3_BUCKET, S3_REGION, VAULT_KMS_KEY_ID and
  # ANTHROPIC_API_KEY — are read by nothing: they were written from the plan
  # rather than from the schema, and the two storage ones were near-misses for
  # STORAGE_BUCKET and STORAGE_REGION, which are what the application wants.
  # The API refuses to boot in production unless STORAGE_DRIVER is s3, so the
  # first deploy would have failed with a message about storage and a compose
  # file that appeared to configure it.
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://amc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/amc
    SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
    LOG_LEVEL: ${LOG_LEVEL:-info}

    # Documents. A folder on the application server is not where a firm's
    # client records belong, which is why production will not accept 'local'.
    STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
    STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
    STORAGE_REGION: ${STORAGE_REGION:-me-central-1}

    # The firm, as it signs its own letters and greets clients on WhatsApp.
    FIRM_NAME: ${FIRM_NAME:-Active Management Consultancy}
    FIRM_SIGNATORY: ${FIRM_SIGNATORY:-}
    FIRM_NAME_ARABIC: ${FIRM_NAME_ARABIC:-}

    BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Asia/Dubai}
    DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-AED}

    # Billing. 0 matches the firm's own invoice template, which carries no
    # VAT line; 500 is the UAE's five percent if that changes.
    BILLING_VAT_BASIS_POINTS: ${BILLING_VAT_BASIS_POINTS:-0}
    BILLING_PAYMENT_TERMS_DAYS: ${BILLING_PAYMENT_TERMS_DAYS:-30}
    BILLING_DEFAULT_RATE_MINOR: ${BILLING_DEFAULT_RATE_MINOR:-30000}

    # WhatsApp. 'log' until Meta approves the business account, which runs the
    # whole path and writes the last step to the log instead of to a phone.
    # 'cloud' requires all four and the API refuses to boot without them.
    WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-log}
    WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

    # Email, read by the worker. No sender means the worker writes emails to
    # the log, which is the right default for a practice without a verified
    # address: a working system and a note, not a crash on the first escalation.
    NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
    SES_REGION: ${SES_REGION:-me-central-1}
  depends_on:
    postgres:
      condition: service_healthy
  # The application writes nothing to its own filesystem; documents go to S3
  # and everything else to Postgres. Saying so turns a remote code execution
  # into something with nowhere to put a payload.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: amc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published on loopback only.
    #
    # Nothing outside this instance can reach it — 127.0.0.1 is not the same as
    # 0.0.0.0, and the security group does not open 5432 either. The reason it
    # is published at all is the nightly backup: `backup.sh` runs `pg_dump` on
    # the host, and the previous comment here claimed backups ran inside the
    # network when nothing did.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amc -d amc"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *server
    restart: "no"
    command: ["node", "packages/database/dist/cli/migrate.js"]
    # Runs to completion before the API starts serving, so a deploy never
    # answers requests against a schema it was not built for.

  api:
    <<: *server
    command: ["node", "--enable-source-maps", "apps/api/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  worker:
    <<: *server
    command: ["node", "--enable-source-maps", "apps/worker/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # A deploy should let the batch in flight finish rather than abandon it.
    stop_grace_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, for example amc.example.ae}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Copies the built browser application into the volume Caddy serves, then
  # exits. Keeping it a separate step means a failed front-end build cannot
  # leave the site half replaced.
  web-publish:
    build:
      context: ..
      target: server
    restart: "no"
    command: ["sh", "-c", "rm -rf /srv/* && cp -r /app/apps/web/dist/. /srv/"]
    volumes:
      - web-dist:/srv

volumes:
  postgres-data:
  web-dist:
  caddy-data:
  caddy-config:
  caddy-logs:
