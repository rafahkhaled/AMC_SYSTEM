# The gate every merge request must pass. It runs exactly what `pnpm verify`
# runs locally, so a pipeline failure is always reproducible on your machine.

default:
  image: node:22
  interruptible: true

stages:
  - verify

variables:
  PNPM_STORE: .pnpm-store
  POSTGRES_DB: amc_test
  POSTGRES_USER: amc
  POSTGRES_PASSWORD: amc
  POSTGRES_HOST_AUTH_METHOD: trust
  # Throwaway key for a throwaway container. Not a secret, and never used
  # anywhere a real one belongs: production refuses to start without its own.
  SECRET_ENCRYPTION_KEY: "etlk3ooNSg49oQ/Tb5DVDCVCBgOOIk5+HQV06BtVtW8="
  TEST_DATABASE_URL: postgres://amc@postgres:5432/amc_test

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

verify:
  stage: verify
  services:
    # Integration tests run against a real Postgres, because constraints,
    # transactions and grants are exactly the things a fake does not have.
    - name: postgres:17-alpine
      alias: postgres
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.0.0 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  script:
    - echo "── lint and format ──"    && pnpm lint
    - echo "── typecheck ──"          && pnpm typecheck
    - echo "── tests ──"              && pnpm test
    - echo "── architecture rules ──" && pnpm arch:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
